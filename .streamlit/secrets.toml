# Streamlit Cloud Secrets 配置示例
# 将此文件复制为 secrets.toml 用于本地测试
# 在 Streamlit Cloud 上，请在 App Settings > Secrets 中配置这些值

[api_keys]
# Kimi API
kimi_api_key = "sk-your-kimi-api-key"
kimi_base_url = "https://api.moonshot.cn/v1"

# OpenAI API (备用)
openai_api_key = "sk-your-openai-api-key"

# MiniMax TTS
minimax_api_key = "your-minimax-api-key"
minimax_group_id = "your-minimax-group-id"
minimax_base_url = "https://api.minimax.chat/v1"

# ElevenLabs TTS
elevenlabs_api_key = "sk_your-elevenlabs-api-key"
elevenlabs_base_url = "https://api.elevenlabs.io/v1"

# Google Cloud (如果使用文件认证，需要在 Streamlit Cloud 设置中上传凭证文件)
# 或者使用 JSON 字符串形式的凭证
# google_credentials_json = '{"type": "service_account", ...}'

[firebase]
enabled = true
project_id = "your-firebase-project-id"
storage_bucket = "your-firebase-bucket.appspot.com"
# Firebase 凭证 JSON 字符串
# credentials_json = '{"type": "service_account", ...}'

[security]
enable_auth = true
use_firebase_auth = false
session_timeout = 60
max_login_attempts = 5
lockout_duration = 15
log_access = true

